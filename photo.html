
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<title>Photo — Obsidian Photography</title>
<meta name="description" content="A single photograph from the Obsidian Photography portfolio.">
<meta name="robots" content="noindex, follow">

<link rel="icon" type="image/png" href="https://res.cloudinary.com/dhbmaw1bm/image/upload/w_96,h_96,c_fill,q_auto,f_png/IMGL1050_wtdpdc">
<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">

<style>

body{
  background:#0e0e0e;
  margin:0;
}

/* IMAGE */

#photo{
  display:block;

  max-width:90vw;
  max-height:85vh;

  width:auto;
  height:auto;

  margin:60px auto;
  border-radius:20px;
  box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

/* BACK */

.back{
  color:white;
  text-decoration:none;
  font-size:12px;
  letter-spacing:0.15em;

  position:fixed;
  top:24px;
  left:24px;

  opacity:0.7;
}

.back:hover{
  opacity:1;
}

/* NAVIGATION */

.nav{
  position:fixed;
  top:50%;
  transform:translateY(-50%);

  background:none;
  border:none;

  color:white;
  font-size:34px;

  cursor:pointer;
  opacity:0.6;
}

.nav:hover{
  opacity:1;
}

.prev{
  left:30px;
}

.next{
  right:30px;
}

</style>

</head>

<body>

<a class="back" id="back" href="index.html">← BACK</a>

<button id="prev" class="nav prev" aria-label="Previous photo">←</button>
<button id="next" class="nav next" aria-label="Next photo">→</button>

<img id="photo">

<script src="js/photos.js"></script>
<script src="js/galerie.js"></script>

<script>

const params = new URLSearchParams(window.location.search);
const img = params.get("img");

const indexIn = (category) =>
  (photos[category] || []).findIndex((entry) => resolveId(entry) === img);

// catégorie d'origine (paramètre cat) si la photo y est, sinon la première qui la contient
let currentCategory = null;
let currentIndex = -1;

const requested = params.get("cat");
if (requested && indexIn(requested) !== -1) {
  currentCategory = requested;
  currentIndex = indexIn(requested);
} else {
  for (const category in photos) {
    const index = indexIn(category);
    if (index !== -1) {
      currentCategory = category;
      currentIndex = index;
      break;
    }
  }
}

const photoUrl = (entry) =>
  `photo.html?img=${encodeURIComponent(resolveId(entry))}&cat=${encodeURIComponent(currentCategory)}`;

// afficher image
if (img) {
  const photoEl = document.getElementById("photo");
  photoEl.src = `${CLOUD}/${img}`;
  photoEl.alt = currentCategory
    ? getAlt(photos[currentCategory][currentIndex], currentCategory, currentIndex)
    : "Obsidian Photography — photo";
  photoEl.addEventListener("load", () => {
    photoEl.width = photoEl.naturalWidth;
    photoEl.height = photoEl.naturalHeight;
  });
}

// retour : page précédente si on vient du site, sinon la page de la catégorie
const back = document.getElementById("back");
if (currentCategory && CATEGORY_PAGES[currentCategory]) {
  back.href = CATEGORY_PAGES[currentCategory];
}
// on retient à l'arrivée si la visite vient d'une galerie du site (les flèches
// remplacent la page, donc le referrer devient ensuite photo.html elle-même)
const ref = document.referrer ? new URL(document.referrer) : null;
const fromSite = !!ref && ref.origin === location.origin;
const fromPhoto = fromSite && ref.pathname.endsWith("/photo.html");
let cameFromSite = fromSite;
try {
  if (!fromPhoto) sessionStorage.setItem("photoFromGallery", fromSite ? "1" : "0");
  cameFromSite = sessionStorage.getItem("photoFromGallery") === "1";
} catch (e) {}
const goBack = () => {
  if (cameFromSite && history.length > 1) history.back();
  else location.href = back.href;
};
back.addEventListener("click", (e) => {
  e.preventDefault();
  goBack();
});

function goTo(step) {
  if (!currentCategory) return;
  const list = photos[currentCategory];
  const index = (currentIndex + step + list.length) % list.length;
  // replace : les flèches ne remplissent pas l'historique, RETOUR ramène à la galerie
  location.replace(photoUrl(list[index]));
}

document.getElementById("next").onclick = () => goTo(1);
document.getElementById("prev").onclick = () => goTo(-1);

// clavier : ← → pour naviguer, Échap pour revenir
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") goTo(1);
  else if (e.key === "ArrowLeft") goTo(-1);
  else if (e.key === "Escape") goBack();
});

// mobile : glisser gauche / droite
let touchX = null;
document.addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 50) goTo(dx < 0 ? 1 : -1);
});

// précharge la photo suivante pour une navigation instantanée
if (currentCategory) {
  const list = photos[currentCategory];
  new Image().src = `${CLOUD}/${resolveId(list[(currentIndex + 1) % list.length])}`;
}

</script>

</body>
</html>
