<!DOCTYPE html>
<html lang="en" data-theme="sable">
<head>
<meta charset="UTF-8">
<title>Photo — Ashtar Photography</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A single photograph from the Ashtar Photography portfolio.">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="https://res.cloudinary.com/dhbmaw1bm/image/upload/w_96,h_96,c_fill,q_auto,f_png/IMGL1050_wtdpdc">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Michroma&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500&text=%E7%8B%90&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>try {
  document.documentElement.dataset.theme = localStorage.getItem("v2-theme") || "sable";
  document.documentElement.lang = localStorage.getItem("v2-lang") || "en";
} catch (e) {}</script>
</head>
<body class="viewer" data-nav="none">

<header class="v-bar label">
  <a id="back" href="index.html">← <span data-fr="Retour">Back</span></a>
  <span class="v-right"><span id="count"></span><span data-theme-dots></span><button data-lang-toggle></button></span>
</header>

<main class="v-stage">
  <button class="v-arrow prev" id="prev" aria-label="Previous photo">←</button>
  <img id="photo" class="loading" alt="">
  <button class="v-arrow next" id="next" aria-label="Next photo">→</button>
</main>

<p class="v-cap" id="cap"></p>

<script src="js/photos.js"></script>
<script src="js/covers.js"></script>
<script src="js/site.js"></script>
<script>
const params = new URLSearchParams(location.search);
const wanted = params.get("img");
const indexIn = (key) => (photos[key] || []).findIndex((entry) => resolveId(entry) === wanted);

// série d'origine (paramètre cat) si la photo y est, sinon la première qui la contient
let key = params.get("cat");
if (!key || indexIn(key) === -1) key = Object.keys(photos).find((k) => indexIn(k) !== -1);
// même ordre mélangé que la page de série d'où l'on vient
const list = key ? seriesList(key) : [];
let index = list.findIndex((entry) => resolveId(entry) === wanted);
const series = findSeries(key);

const photoEl = document.getElementById("photo");
const back = document.getElementById("back");
if (series) { back.href = series.href; back.innerHTML = `← ${nameHTML(series)} ${series.jp}`; applyLang(back); }

function show() {
  const entry = list[index];
  photoEl.classList.add("loading");
  photoEl.addEventListener("load", () => photoEl.classList.remove("loading"), { once: true });
  photoEl.sizes = "92vw";
  photoEl.srcset = srcset(entry);
  photoEl.src = url(2000, entry);
  const name = series ? `${series.name} ${series.jp}` : "Ashtar Photography";
  photoEl.alt = entryAlt(entry, `${name} — photo ${index + 1}`);
  document.getElementById("cap").textContent = entryAlt(entry, "");
  document.getElementById("count").textContent = `${pad(index + 1)} / ${pad(list.length)}`;
  document.title = `${name} — ${pad(index + 1)} — Ashtar Photography`;

  // précharge la suivante pour une navigation instantanée
  const pre = new Image();
  pre.sizes = "92vw";
  pre.srcset = srcset(list[(index + 1) % list.length]);
}

function go(step) {
  if (!list.length) return;
  index = (index + step + list.length) % list.length;
  // replaceState : les flèches ne remplissent pas l'historique, Retour ramène à la galerie
  history.replaceState(null, "", photoHref(list[index], key));
  show();
}

// retour : page précédente si on vient du site, sinon la page de la série
const fromSite = document.referrer && new URL(document.referrer).origin === location.origin;
const goBack = () => {
  if (fromSite && history.length > 1) history.back();
  else location.href = back.href;
};
back.addEventListener("click", (e) => { e.preventDefault(); goBack(); });

document.getElementById("next").onclick = () => go(1);
document.getElementById("prev").onclick = () => go(-1);
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "Escape") goBack();
});

// mobile : glisser gauche / droite
let touchX = null;
document.addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
});

if (index !== -1) show();
else {
  document.getElementById("cap").innerHTML = tr("Photo not found.", "Photo introuvable.");
  applyLang();
}
</script>
</body>
</html>
